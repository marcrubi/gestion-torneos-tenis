# Configuración de la base de datos PostgreSQL
debug=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración básica de SMTP para Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# Configuración del puerto de la aplicación
server.port=${PORT:8080}

# URL de la aplicación (para generación de enlaces en correos)
spring.application.url=${APP_URL}
spring.main.allow-bean-definition-overriding=true
app.url=${APP_URL}


# Configuración de Thymeleaf
spring.thymeleaf.cache=false
logging.level.com.ISII.gestion_torneos_tenis.service.JugadorService=DEBUG
logging.level.org.springframework.security=DEBUG
